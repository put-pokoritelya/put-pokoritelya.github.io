name: Author original photo
on:
  push:
    paths:
      - '.github/workflows/author-original-photo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable global photo filter for author portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aleksandr-ermolchev/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.author-portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;transform:none}'
          new = '.author-portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;transform:none;filter:none}'
          if old not in s:
              raise SystemExit('Author portrait CSS rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aleksandr-ermolchev/index.html
          git commit -m "Автор: показать оригинальное фото без фильтра"
          git push
