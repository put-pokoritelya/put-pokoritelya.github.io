name: Fix soon rotation
on:
  push:
    paths:
      - '.github/workflows/fix-soon-rotation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make upcoming rotation always run
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){\n        setInterval(function(){i=(i+1)%guests.length;show(i);},7000);\n      }"""
          new="""      function advance(){i=(i+1)%guests.length;show(i);}\n      /* Контент должен меняться даже при Reduce Motion; сама анимация при этом\n         отключается глобальными CSS-правилами accessibility. */\n      setTimeout(function(){advance();setInterval(advance,6000);},2500);"""
          if old not in s:
              raise SystemExit('Rotation guard not found; aborting safely')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Главная: запускать ротацию будущих героев для всех пользователей"
          git push
