name: Photo V2 rollout

on:
  push:
    branches:
      - photo-v2-rollout
    paths:
      - 'scripts/rollout_photo_v2.py'
      - '.github/workflows/photo-v2-rollout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: photo-v2-rollout
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Switch site references to Photo V2
        run: python scripts/rollout_photo_v2.py

      - name: Commit rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!scripts/rollout_photo_v2.py' ':!.github/workflows/photo-v2-rollout.yml'
          if git diff --cached --quiet; then
            echo "No rollout changes"
          else
            git commit -m "Photo v2: switch site portrait references [photo-v2-rollout]"
            git push origin HEAD:photo-v2-rollout
          fi
