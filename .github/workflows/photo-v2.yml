name: Photo V2 batch

on:
  push:
    branches:
      - photo-v2-living-editorial
    paths:
      - 'scripts/photo_v2_batch.py'
      - 'assets/photo/**'
      - '.github/workflows/photo-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: photo-v2-living-editorial
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow numpy opencv-python-headless

      - name: Process all hero portraits
        run: python scripts/photo_v2_batch.py

      - name: Commit generated preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photo-v2 photo-v2-report.csv photo-v2-contact-sheet.jpg photo-v2-preview.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Photo v2: batch output [photo-v2-output]"
            git push origin HEAD:photo-v2-living-editorial
          fi
