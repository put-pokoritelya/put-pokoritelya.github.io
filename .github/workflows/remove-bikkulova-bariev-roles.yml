name: Remove Bikkulova and Bariev roles
on:
  push:
    paths:
      - '.github/workflows/remove-bikkulova-bariev-roles.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove current roles everywhere
        run: |
          python - <<'PY'
          from pathlib import Path

          people = [
              {
                  'name': 'Гульнара Биккулова',
                  'roles': ['Директор Университета НЕЙМАРК', 'Директор университета НЕЙМАРК'],
                  'data_search_old': 'гульнара биккулова директор университета неймарк ответственность',
                  'data_search_new': 'гульнара биккулова ответственность',
                  'data_q_old': 'гульнара биккулова директор университета неймарк неймарк',
                  'data_q_new': 'гульнара биккулова неймарк',
              },
              {
                  'name': 'Искандер Бариев',
                  'roles': ['Директор Университета Иннополис'],
                  'data_search_old': 'искандер бариев директор университета иннополис ответственность',
                  'data_search_new': 'искандер бариев ответственность',
                  'data_q_old': 'искандер бариев директор университета иннополис иннополис',
                  'data_q_new': 'искандер бариев иннополис',
              },
          ]

          text_exts = {'.html', '.json', '.xml'}
          changed = []

          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              old = s

              for person in people:
                  name = person['name']
                  s = s.replace(person['data_search_old'], person['data_search_new'])
                  s = s.replace(person['data_q_old'], person['data_q_new'])

                  for role in person['roles']:
                      for before, after in [
                          (f'<span class="role">{role}</span>', ''),
                          (f'<span class="gn-r">{role}</span>', ''),
                          (f'<p class="ep-role">{role}</p>', ''),
                          (f'      <p class="ep-role">{role}</p>\n', ''),
                          (f'<span class="r">{role}</span>', ''),
                          (f'<i>{role}</i>', ''),
                          (f'<p class="l-role">{role}</p>', ''),
                          (f', "jobTitle": "{role}"', ''),
                          (f'{name} · {role}', name),
                          (f'"t":"{name}","s":"{role}"', f'"t":"{name}","s":""'),
                      ]:
                          s = s.replace(before, after)

              # Убираем должности из описаний выпуска и поискового/RSS-текста,
              # сохраняя содержание самого разговора.
              s = s.replace(
                  'Директор университета НЕЙМАРК — о кинематографической картинке Иннополиса, о том, почему большие инвестиции в будущее может позволить себе только государство или корпорация, и об университете как среде, формирующей характер.',
                  'О кинематографической картинке Иннополиса, о том, почему большие инвестиции в будущее может позволить себе только государство или корпорация, и об университете как среде, формирующей характер.'
              )
              s = s.replace(
                  'Директор Университета НЕЙМАРК — о кинематографической картинке Иннополиса, о том, почему большие инвестиции в будущее может позволить себе только государство или корпорация, и об университете как среде, формирующей характер.',
                  'О кинематографической картинке Иннополиса, о том, почему большие инвестиции в будущее может позволить себе только государство или корпорация, и об университете как среде, формирующей характер.'
              )
              s = s.replace(' Возглавила Университет НЕЙМАРК в 2025 году.', '')
              s = s.replace('Возглавила Университет НЕЙМАРК в 2025 году.', '')

              s = s.replace(
                  'Директор Университета Иннополис — о первом знакомстве с университетом в роли индустриального партнёра из Роснано и об экономике вуза: 75% коммерческих контрактов и конкурентоспособность к 2030 году.',
                  'О первом знакомстве с университетом в роли индустриального партнёра из Роснано и об экономике вуза: 75% коммерческих контрактов и конкурентоспособность к 2030 году.'
              )
              s = s.replace(
                  'В Университете Иннополис с 2016 года: проректор по проектной и научно-исследовательской деятельности, затем заместитель директора, с августа 2024 года — директор университета. Руководит передовой инженерной школой Иннополиса.',
                  'В Университете Иннополис с 2016 года: проректор по проектной и научно-исследовательской деятельности, затем заместитель директора.'
              )

              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print('Changed files:')
          print('\n'.join(changed))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Дочистить должности Биккуловой и Бариева во всех материалах"
            git push
          fi
