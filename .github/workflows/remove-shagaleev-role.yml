name: Remove Shagaleev role
on:
  push:
    paths:
      - '.github/workflows/remove-shagaleev-role.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove outdated Shagaleev role from visible metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          role='Заместитель председателя правления фонда «Сколково»'

          # Герои: убрать должность из видимой строки и из поискового data-q.
          p=Path('geroi/index.html')
          s=p.read_text()
          s=s.replace('data-q="руслан шагалеев заместитель председателя правления фонда «сколково» сколково"',
                      'data-q="руслан шагалеев сколково"')
          s=s.replace(f'<span class="gn-r">{role}</span>','')
          p.write_text(s)

          # Каталог выпусков: убрать должность из карточки и поискового индекса карточки.
          p=Path('vypuski/index.html')
          s=p.read_text()
          s=s.replace('data-search="руслан шагалеев заместитель председателя правления фонда «сколково» среда"',
                      'data-search="руслан шагалеев среда"')
          s=s.replace(f'<span class="role">{role}</span>','')
          p.write_text(s)

          # Страница выпуска: убрать видимую должность и jobTitle из schema.org.
          p=Path('vypuski/ruslan-shagaleev/index.html')
          s=p.read_text()
          s=s.replace(f'      <p class="ep-role">{role}</p>\n','')
          s=s.replace(f', "jobTitle": "{role}"','')
          p.write_text(s)

          # Оглавление книги: оставить только имя героя.
          p=Path('kniga/index.html')
          s=p.read_text().replace(f'Руслан Шагалеев · {role}','Руслан Шагалеев')
          p.write_text(s)

          # Глобальный поиск: поле должности у выпуска становится пустым.
          p=Path('poisk/index.json')
          s=p.read_text().replace(f'"t":"Руслан Шагалеев","s":"{role}"',
                                  '"t":"Руслан Шагалеев","s":""')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geroi/index.html vypuski/index.html vypuski/ruslan-shagaleev/index.html kniga/index.html poisk/index.json
          git commit -m "Убрать должность Руслана Шагалеева с сайта"
          git push
