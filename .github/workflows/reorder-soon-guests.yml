name: Reorder soon guests
on:
  push:
    paths:
      - '.github/workflows/reorder-soon-guests.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder upcoming hero cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_card='''    <div class="summit-card" data-rise="4" aria-label="Скоро на канале: Александр Гасников">\n      <span class="summit-head">\n        <span class="summit-label">Скоро на канале</span>\n        <span aria-hidden="true">↗</span>\n      </span>\n      <span class="summit-photo"><img src="assets/photo/soon/aleksandr-gasnikov.jpg" alt="Александр Гасников" width="480" height="360" fetchpriority="high"></span>\n      <span class="summit-meta">Уже записан · Студия МФТИ</span>\n      <strong>Александр Гасников</strong>\n      <span class="summit-role">Ректор Университета Иннополис</span>'''
          new_card='''    <div class="summit-card" data-rise="4" aria-label="Скоро на канале: Сергей Самойленко">\n      <span class="summit-head">\n        <span class="summit-label">Скоро на канале</span>\n        <span aria-hidden="true">↗</span>\n      </span>\n      <span class="summit-photo"><img src="assets/photo/soon/sergey-samoylenko.jpg" alt="Сергей Самойленко" width="480" height="360" fetchpriority="high"></span>\n      <span class="summit-meta">Уже записан · Студия МФТИ</span>\n      <strong>Сергей Самойленко</strong>\n      <span class="summit-role">Вулканолог, кандидат физико-математических наук</span>'''
          if old_card not in s:
              raise SystemExit('Initial card block not found; aborting safely')
          s=s.replace(old_card,new_card,1)

          old_guests='''      var guests=[\n        {p:'assets/photo/soon/aleksandr-gasnikov.jpg',n:'Александр Гасников',r:'Ректор Университета Иннополис',m:'Уже записан · Студия МФТИ'},\n        {p:'assets/photo/soon/sergey-samoylenko.jpg',n:'Сергей Самойленко',r:'Вулканолог, кандидат физико-математических наук',m:'Уже записан · Студия МФТИ'},\n        {p:'assets/photo/soon/elena-mironenko.jpg',n:'Елена Мироненко',r:'Генеральный директор музея «АТОМ»',m:'Уже записана · Студия МФТИ'},\n        {p:'assets/photo/soon/alina-osmakova.jpg',n:'Алина Осьмакова',r:'Заместитель директора ФИЦ Биотехнологии РАН',m:'Уже записана · Студия МФТИ'},\n        {p:'assets/photo/soon/aleksey-egorov.jpg',n:'Алексей Егоров',r:'Журналист, автор и ведущий телеканала «Наука»',m:'Уже записан · Студия МФТИ'}\n      ];'''
          new_guests='''      var guests=[\n        {p:'assets/photo/soon/sergey-samoylenko.jpg',n:'Сергей Самойленко',r:'Вулканолог, кандидат физико-математических наук',m:'Уже записан · Студия МФТИ'},\n        {p:'assets/photo/soon/elena-mironenko.jpg',n:'Елена Мироненко',r:'Генеральный директор музея «АТОМ»',m:'Уже записана · Студия МФТИ'},\n        {p:'assets/photo/soon/aleksandr-gasnikov.jpg',n:'Александр Гасников',r:'Ректор Университета Иннополис',m:'Уже записан · Студия МФТИ'},\n        {p:'assets/photo/soon/aleksey-egorov.jpg',n:'Алексей Егоров',r:'Журналист, автор и ведущий телеканала «Наука»',m:'Уже записан · Студия МФТИ'},\n        {p:'assets/photo/soon/alina-osmakova.jpg',n:'Алина Осьмакова',r:'Заместитель директора ФИЦ Биотехнологии РАН',m:'Уже записана · Студия МФТИ'}\n      ];'''
          if old_guests not in s:
              raise SystemExit('Guests array not found; aborting safely')
          p.write_text(s.replace(old_guests,new_guests,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Главная: порядок будущих героев — Самойленко, Мироненко, Гасников, Егоров, Осьмакова"
          git push
