name: Rotate soon summit cards
on:
  push:
    paths:
      - '.github/workflows/rotate-soon-summit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stable rotation for upcoming guests only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          old='''    <div class="summit-card" data-rise="4" aria-label="Скоро на канале: Александр Гасников">\n      <span class="summit-head">\n        <span class="summit-label">Скоро на канале</span>\n        <span aria-hidden="true">↗</span>\n      </span>\n      <span class="summit-photo"><img src="assets/photo/soon/aleksandr-gasnikov.jpg" alt="Александр Гасников" width="480" height="360" fetchpriority="high"></span>\n      <span class="summit-meta">Уже записан · Студия МФТИ</span>\n      <strong>Александр Гасников</strong>\n      <span class="summit-role">Ректор Университета Иннополис</span>\n      <a class="summit-action" href="https://t.me/put_pokoritelya" target="_blank" rel="noopener noreferrer">Перейти в Telegram <span aria-hidden="true">↗</span></a>\n    </div>'''

          new='''    <div class="summit-card" data-rise="4" aria-label="Скоро на канале: Александр Гасников">\n      <span class="summit-head">\n        <span class="summit-label">Скоро на канале</span>\n        <span aria-hidden="true">↗</span>\n      </span>\n      <span class="summit-photo"><img src="assets/photo/soon/aleksandr-gasnikov.jpg" alt="Александр Гасников" width="480" height="360" fetchpriority="high"></span>\n      <span class="summit-meta">Уже записан · Студия МФТИ</span>\n      <strong>Александр Гасников</strong>\n      <span class="summit-role">Ректор Университета Иннополис</span>\n      <a class="summit-action" href="https://t.me/put_pokoritelya" target="_blank" rel="noopener noreferrer">Перейти в Telegram <span aria-hidden="true">↗</span></a>\n    </div>\n    <script>\n    (function(){\n      var card=document.querySelector('.summit-card');\n      if(!card)return;\n      var guests=[\n        {p:'assets/photo/soon/aleksandr-gasnikov.jpg',n:'Александр Гасников',r:'Ректор Университета Иннополис',m:'Уже записан · Студия МФТИ'},\n        {p:'assets/photo/soon/sergey-samoylenko.jpg',n:'Сергей Самойленко',r:'Вулканолог, кандидат физико-математических наук',m:'Уже записан · Студия МФТИ'},\n        {p:'assets/photo/soon/elena-mironenko.jpg',n:'Елена Мироненко',r:'Генеральный директор музея «АТОМ»',m:'Уже записана · Студия МФТИ'},\n        {p:'assets/photo/soon/alina-osmakova.jpg',n:'Алина Осьмакова',r:'Заместитель директора ФИЦ Биотехнологии РАН',m:'Уже записана · Студия МФТИ'},\n        {p:'assets/photo/soon/aleksey-egorov.jpg',n:'Алексей Егоров',r:'Журналист, автор и ведущий телеканала «Наука»',m:'Уже записан · Студия МФТИ'}\n      ];\n      guests.slice(1).forEach(function(g){var im=new Image();im.src=g.p;});\n      var i=0, img=card.querySelector('.summit-photo img'), meta=card.querySelector('.summit-meta'), name=card.querySelector('strong'), role=card.querySelector('.summit-role');\n      function show(next){\n        var g=guests[next], preload=new Image();\n        preload.src=g.p;\n        var apply=function(){\n          card.classList.add('is-switching');\n          setTimeout(function(){\n            img.src=g.p;img.alt=g.n;meta.textContent=g.m;name.textContent=g.n;role.textContent=g.r;card.setAttribute('aria-label','Скоро на канале: '+g.n);\n            requestAnimationFrame(function(){card.classList.remove('is-switching');});\n          },180);\n        };\n        if(preload.complete){apply();}else{preload.onload=apply;}\n      }\n      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){\n        setInterval(function(){i=(i+1)%guests.length;show(i);},7000);\n      }\n    })();\n    </script>'''

          if old not in s:
              raise SystemExit('Static summit block not found; aborting safely')
          s=s.replace(old,new,1)
          p.write_text(s)

          css=Path('assets/site.css')
          c=css.read_text()
          marker='''  .summit-action {\n    display: inline-block !important;\n    width: auto !important;\n  }'''
          addition='''  .summit-action {\n    display: inline-block !important;\n    width: auto !important;\n  }'''
          # no mobile-only change needed here; add global rule before first media block
          if '.summit-card.is-switching' not in c:
              c=c.replace("@media(max-width:880px)", ".summit-card .summit-photo img,.summit-card strong,.summit-card .summit-role,.summit-card .summit-meta{transition:opacity .18s ease}\n.summit-card.is-switching .summit-photo img,.summit-card.is-switching strong,.summit-card.is-switching .summit-role,.summit-card.is-switching .summit-meta{opacity:.18}\n.summit-card strong{min-height:2.3em}\n.summit-card .summit-role{min-height:2.9em}\n@media(max-width:880px)",1)
          css.write_text(c)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/site.css
          git commit -m "Главная: ротировать только будущих героев без скачка карточки"
          git push
