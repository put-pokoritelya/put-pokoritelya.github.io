<svg xmlns="http://www.w3.org/2000/svg">
  <!-- 16.09.2026: сила приглушена до 60 процентов от исходной матрицы. Полная
       версия гасила цветные стены студии вместе с живым тоном кожи; ослабленная
       снимает розовый и фиолетовый фон, но лица остаются тёплыми. Суммы строк
       равны 1, поэтому нейтральный серый не смещается. -->
  <filter id="warm-editorial" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="
      0.838 0.162 0.0   0  0.0
      0.168 0.574 0.258 0  0.0
      0.0   0.198 0.802 0  0.003
      0     0     0     1  0"/>
  </filter>
</svg>
