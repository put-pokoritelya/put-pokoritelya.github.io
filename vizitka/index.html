<style>
  /* Палитра сайта put-pokoritelya.ru */
  :root{
    --bg:#FBF9F5;         /* фон страницы */
    --surface:#F2F0ED;    /* плитки, поверхности */
    --surface-hi:#E4E2DE; /* ховер */
    --text:#1B1C1A;       /* основной текст */
    --red:#B6171E;        /* акцент, кнопки */
    --red-hi:#C42221;
    --line:rgba(27,28,26,.14);
    --muted:rgba(27,28,26,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--text);background:var(--bg);min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .card{max-width:430px;margin:0 auto;min-height:100vh;
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    padding:0 22px 48px}

  header{padding:22px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
  header h1{font-family:Prata,"Times New Roman",serif;font-weight:400;font-size:28px;
    letter-spacing:.01em}

  #qrs{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .qrrow{border:1px solid var(--line);background:var(--surface)}
  .qrrow summary{list-style:none;cursor:pointer;padding:15px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--text)}
  .qrrow summary::-webkit-details-marker{display:none}
  .qrrow summary .sub{color:var(--muted);letter-spacing:.04em;text-transform:none;
    font-size:13px;word-break:break-all;text-align:right}
  .qrrow[open]{border-color:var(--red)}
  .qrbox{padding:0 16px 16px;display:flex;justify-content:center}
  .qrbox svg{width:100%;max-width:230px;height:auto;background:#fff;
    padding:10px;display:block}

  #save{width:100%;font:inherit;font-size:13px;font-weight:600;color:#FBF9F5;
    text-transform:uppercase;letter-spacing:.12em;cursor:pointer;
    background:var(--red);border:0;padding:18px;margin-bottom:20px;
    transition:background .15s}
  #save:hover{background:var(--red-hi)}

  .photo{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;
    display:flex;align-items:center;justify-content:center;
    font-family:Prata,serif;font-size:76px;
    background:var(--surface);border:1px solid var(--line);margin-bottom:20px}

  .name{font-family:Prata,"Times New Roman",serif;font-weight:400;
    font-size:34px;line-height:1.15;margin-bottom:14px}
  .bio{font-size:17px;line-height:1.55;color:var(--muted);white-space:pre-line;
    padding-left:14px;border-left:2px solid var(--red);margin-bottom:8px}

  h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;
    color:var(--muted);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
  h2::before{content:"";width:22px;height:2px;background:var(--red);flex:0 0 auto}

  .panel{border-bottom:1px solid var(--line);padding:15px 0}
  a.panel{display:block;text-decoration:none;color:var(--text);transition:padding-left .15s}
  a.panel:hover{padding-left:6px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .row b{font-weight:500;font-size:16px}
  .row span{color:var(--muted);font-size:15px;text-align:right;word-break:break-all}
  .fact{font-size:15px;line-height:1.5;color:var(--muted)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .grid a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:24px 10px;text-decoration:none;color:var(--text);text-align:center;
    font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    background:var(--surface);border:1px solid var(--line);transition:border-color .15s,background .15s}
  .grid a:hover{background:var(--surface-hi);border-color:var(--red)}
  .grid svg{width:26px;height:26px}

  footer{color:var(--muted);font-size:12px;margin-top:40px;padding-top:18px;
    border-top:1px solid var(--line);text-transform:uppercase;letter-spacing:.1em}
</style>
</head>

</div>

const $ = id => document.getElementById(id);
$("qr1").innerHTML = qrSvg(QR.contact);
$("qr2").innerHTML = qrSvg(QR.site);

// мышь — раскрывается по наведению; тап на телефоне открывает штатно, по клику
for (const d of document.querySelectorAll(".qrrow")) {
  d.onpointerenter = e => { if (e.pointerType === "mouse") d.open = true; };
  d.onpointerleave = e => { if (e.pointerType === "mouse") d.open = false; };
}
$("brand").textContent = D.brand;
$("name").textContent  = D.name;
$("bio").textContent   = D.bio;
if (D.photo) {
  // если картинка не загрузилась (нет сети / блокировка) — показываем инициалы
  $("photo").outerHTML =
    `<img class="photo" id="photo" src="${D.photo}" alt="${D.name}"
      onerror="this.outerHTML='<div class=\\'photo\\'>${D.initials}</div>'">`;
} else { $("photo").textContent = D.initials; }

const row = i => `<a class="panel" href="${i.href}" target="_blank" rel="noopener">
  <div class="row"><b>${i.label}</b><span>${i.value}</span></div></a>`;
$("facts").innerHTML    = D.facts.map(f => `<div class="panel fact">${f}</div>`).join("");
$("contacts").innerHTML = D.contacts.map(row).join("");
$("links").innerHTML    = D.links.map(row).join("");
$("socials").innerHTML  = D.socials.map(s =>
  `<a href="${s.href}" target="_blank" rel="noopener">${ICON[s.icon]}<span>${s.label}</span></a>`
).join("");

function vcard() {
  const esc = s => String(s).replace(/([,;\\])/g, "\\$1");
  const [last, ...first] = D.name.split(" ").reverse();
  const l = ["BEGIN:VCARD", "VERSION:3.0",
    `N:${esc(last)};${esc(first.reverse().join(" "))};;;`,
    `FN:${esc(D.name)}`];
  if (D.org)   l.push(`ORG:${esc(D.org)}`);
  if (D.title) l.push(`TITLE:${esc(D.title)}`);
  for (const c of D.contacts) {
    if (c.vcard === "email") l.push(`EMAIL;TYPE=INTERNET:${esc(c.value)}`);
    else if (c.vcard === "tel") l.push(`TEL;TYPE=CELL:${esc(c.value)}`);
    else l.push(`URL:${c.href}`);
  }
  for (const x of D.socials) l.push(`URL:${x.href}`);
  l.push("END:VCARD");
  return l.join("\r\n");
}

$("save").onclick = () => {
  // раскрываем QR с vCard — работает везде, в т.ч. где скачивание запрещено
  document.querySelector(".qrrow").open = true;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([vcard()], {type:"text/vcard"}));
  a.download = "aleksandr-ermolchev.vcf";
  a.click();
  URL.revokeObjectURL(a.href);
};

// самопроверка vCard
console.assert(/^BEGIN:VCARD\r\n/.test(vcard()) && /END:VCARD$/.test(vcard())
  && vcard().includes("FN:"), "vCard malformed");
